<script>
(function() {
    var base = 'https://raw.githubusercontent.com/{{ site.repository }}/';
    var url = base + 'google-scholar-stats/gs_data.json';

    function render(data) {
        // Homepage summary: stays hidden unless every number and the data date arrived.
        var summary = document.getElementById('scholar-summary');
        var day = (data.updated || '').slice(0, 10);
        if (summary && data.citedby != null && data.hindex != null && day) {
            document.getElementById('scholar_citedby').textContent = data.citedby;
            document.getElementById('scholar_hindex').textContent = data.hindex;
            document.getElementById('scholar_updated').textContent = day;
            summary.hidden = false;
        }
        // Per-paper counts show once a paper has at least MIN_SHOWN citations.
        var MIN_SHOWN = 10;
        var pubs = data.publications || {};
        document.querySelectorAll('.show_paper_citations').forEach(function(el) {
            var id = el.getAttribute('data');
            var n = pubs[id] && pubs[id].num_citations;
            if (n >= MIN_SHOWN) el.innerHTML = '| Citations: ' + n;
        });
    }

    function go() {
        fetch(url, {cache: 'no-store'})
            .then(function(r) {
                if (!r.ok) throw new Error('Scholar data HTTP ' + r.status);
                return r.json();
            })
            .then(render)
            .catch(function(e) { console.warn('scholar stats fetch failed:', e); });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', go);
    } else {
        go();
    }
})();
</script>
