<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card</title>
<!-- Renders one 1200x630 share card: /tools/og-card.html?card=<name>, with the
     cards defined in _data/og_cards.yml. `make og-cards` screenshots each one
     into images/og/. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;display:flex;overflow:hidden;background:#fff;border-left:14px solid #224b8d;color:#1a1a24;font-family:Inter,-apple-system,"Helvetica Neue",sans-serif}
.text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:60px 28px 54px 62px}
.kicker{font-size:21px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#224b8d}
h1{margin:16px 0 0;font-size:50px;font-weight:700;line-height:1.14;letter-spacing:-.01em}
p{margin:20px 0 0;font-size:25px;line-height:1.38;color:#4a5160}
.by{font-size:23px;font-weight:600}
.by span{font-weight:400;color:#6b7280}
.side{display:flex;align-items:center;justify-content:center;width:500px;padding:44px 50px 44px 8px}
.side:empty{display:none}
.side img{display:block;max-width:100%;max-height:100%}
.side img.avatar{width:330px;height:330px;border-radius:50%;object-fit:cover}
.stat{text-align:center}
.stat b{display:block;font-size:150px;line-height:1;letter-spacing:-.03em;color:#224b8d}
.stat span{display:block;margin-top:14px;font-size:24px;line-height:1.3;color:#4a5160}
</style>
</head>
<body>
<div class="text">
  <div><div class="kicker"></div><h1></h1><p></p></div>
  <div class="by">{{ site.author.name }} <span>· {{ site.repository | split: "/" | last }}</span></div>
</div>
<div class="side"></div>
<script>
var cards = {{ site.data.og_cards | jsonify }};
var name = new URLSearchParams(location.search).get('card');
var card = cards.filter(function(c) { return c.name === name; })[0];
if (!card) {
  document.body.textContent = 'Unknown card "' + name + '". Known: ' + cards.map(function(c) { return c.name; }).join(', ');
} else {
  document.querySelector('.kicker').textContent = card.kicker;
  var title = document.querySelector('h1');
  title.textContent = card.title;
  if (card.title_size) title.style.fontSize = card.title_size + 'px';
  document.querySelector('p').textContent = card.sub;
  var side = document.querySelector('.side');
  if (card.figure) {
    var img = new Image();
    img.src = card.figure;
    if (card.avatar) img.className = 'avatar';
    side.appendChild(img);
  } else if (card.stat) {
    var stat = document.createElement('div');
    stat.className = 'stat';
    stat.appendChild(document.createElement('b')).textContent = card.stat[0];
    stat.appendChild(document.createElement('span')).textContent = card.stat[1];
    side.appendChild(stat);
  }
}
</script>
</body>
</html>
