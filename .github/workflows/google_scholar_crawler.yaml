name: Get Citation Data

# Scholar answers 403 to GitHub's runner IPs, so the automatic triggers could
# only ever fail. They are kept here, commented out, to switch back on if that
# changes; until then run this by hand from the Actions tab.
on:
 workflow_dispatch:
# page_build:
# schedule:
#  - cron:  '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v2
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        # On a 403 scholarly backs off for 90s+ and retries until the job times
        # out; cap it so a blocked run fails in two minutes with a real error.
        timeout -s INT 120 python3 -u main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}