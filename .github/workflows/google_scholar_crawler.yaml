name: Get Citation Data

on:
  workflow_dispatch:

# Scholar currently returns 403 to both Ubuntu and macOS hosted runners.
# Daily collection runs through the owner's local Codex automation instead.
# Keep this manual entry point for checking hosted-runner access in the future.

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test citation parsing and failure handling
        run: python -m unittest discover -s google_scholar_crawler -p test_main.py
      - name: Checkout current statistics
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: _citation_stats
      - name: Collect and validate public Scholar data
        env:
          GOOGLE_SCHOLAR_ID: Iw3bTCAAAAAJ
        run: >-
          python google_scholar_crawler/main.py
          --previous _citation_stats/gs_data.json
          --output _citation_stats
      - name: Publish verified statistics
        working-directory: _citation_stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified Scholar citation data'
          git push origin HEAD:google-scholar-stats
