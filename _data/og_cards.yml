# Share cards (og:image / twitter:image), one 1200x630 PNG per entry in
# images/og/<name>.png. Rendered by tools/og-card.html; regenerate with
# `make og-cards`. A page uses a card through `image: /images/og/<name>.png`
# in its front matter; `home` is the site default (`og_image` in _config.yml).
#
# Fields:
#   name        output file name
#   kicker      small label above the title
#   title, sub  card text; keep `sub` to one or two lines
#   figure      optional image path shown on the right
#   avatar      true: crop `figure` to a circle
#   stat        optional [value, label] shown on the right instead of a figure
#   title_size  optional title size in px (default 50)
- name: home
  kicker: "Research Scientist · ByteDance"
  title: "Yu Mao (Audrey)"
  sub: "I build LLM systems whose behavior can be checked, not just benchmarked: inference, compression, capability probing and agent reliability."
  figure: "/images/selfie-tetons-center.jpg"
  avatar: true
  title_size: 64

