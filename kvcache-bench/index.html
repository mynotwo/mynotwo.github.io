t-medium: 600; /* paper titles, chips, nav home item               */\n  --weight-bold:   700; /* headings, highlighted author name                */\n\n  /* ---- Line heights ----------------------------------------------------- */\n  --leading-body:    1.5;\n  --leading-heading: 1.2;\n  --leading-tight:   1.35; /* paper titles                                   */\n}\n\n/* ==========================================================================\n   SPACING, RADII, SHADOWS, MOTION — Yu Mao Homepage Design System\n   ========================================================================== */\n\n:root {\n  /* ---- Spacing ---------------------------------------------------------- */\n  /* The theme spaces with em multiples of the 14px root. These are the       */\n  /* recurring rhythm values seen across base/page/paper styles.              */\n  --space-0:   0;\n  --space-1:   0.25em; /* ~3.5px  — chip padding, tag gaps                   */\n  --space-2:   0.5em;  /* ~7px    — paragraph margins, nav padding          */\n  --space-3:   0.9em;  /* ~12px   — paper-box vertical padding              */\n  --space-4:   1em;    /* ~14px   — #main gutter, section gap               */\n  --space-5:   1.2em;  /* ~17px   — paper text indent                       */\n  --space-6:   2em;    /* ~28px   — section / hero margins                  */\n  --space-7:   3em;    /* ~42px   — hero overlay padding                    */\n\n  /* Layout */\n  --container-max: 1280px; /* $x-large — #main max width                    */\n  --layout-large:  925px;  /* $large — two-column breakpoint                */\n  --sidebar-span:  200px;  /* ~2 of 12 cols — author sidebar width          */\n\n  /* ---- Radii ------------------------------------------------------------ */\n  --radius:       4px;  /* $border-radius — buttons, code, cards            */\n  --radius-chip:  3px;  /* venue chips, tags, paper thumbnails, link btns   */\n  --radius-round: 50%;  /* avatar                                           */\n\n  /* ---- Borders ---------------------------------------------------------- */\n  --border-width: 1px;\n  --border-hair:  1px solid var(--border);\n  --border-rule:  1px solid var(--rule-paper);\n\n  /* ---- Shadows ---------------------------------------------------------- */\n  --shadow-sm:    0 1px 1px rgba(0, 0, 0, 0.125);  /* $box-shadow — code     */\n  --shadow-thumb: 1px 1px 4px rgba(0, 0, 0, 0.18); /* paper thumbnails       */\n  --shadow-pop:   0 0 10px rgba(0, 0, 0, 0.25);    /* dropdowns, hovered img */\n\n  /* ---- Motion ----------------------------------------------------------- */\n  --transition:        all 0.2s ease-in-out; /* @kind other */\n  --transition-bg:     background 0.15s ease; /* @kind other */\n  --intro-duration:    0.3s; /* @kind other */\n}\n\n/* ==========================================================================\n   FONTS — Yu Mao Homepage Design System\n\n   Body & headings use a SYSTEM-FONT stack (Trebuchet MS / Georgia / Monaco) —\n   there are NO body webfonts to ship. The only webfonts are ICON fonts used\n   for the academic / social link rail in the author sidebar:\n\n     • Academicons  — Google Scholar, ORCID, DBLP, arXiv, etc. (shipped below)\n     • Font Awesome — generic social + UI glyphs (load from CDN in consumers)\n\n   Font Awesome 6 free, for consumers, via CDN:\n     <link rel=\"stylesheet\"\n           href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css\">\n   ========================================================================== */\n\n/* The Academicons @font-face + .ai-* glyph classes ship from\n   assets/css/academicons.min.css (imported by styles.css). Nothing to\n   redeclare here for the icon font. */\n\n/* ---- System fonts (local-only, no binaries shipped) --------------------- */\n/* These declare the body/code typefaces as locally-installed system fonts so\n   the family names resolve when present, with the token stacks falling back\n   gracefully when they are not. No webfont binary is downloaded. */\n@font-face {\n  font-family: \"Trebuchet MS\";\n  src: local(\"Trebuchet MS\"), local(\"TrebuchetMS\");\n  font-weight: 400 700;\n  font-style: normal;\n}\n@font-face {\n  font-family: \"Lucida Console\";\n  src: local(\"Lucida Console\"), local(\"LucidaConsole\");\n  font-weight: 400;\n  font-style: normal;\n}\n\n/* ==========================================================================\n   UTILITIES — small global rules the components rely on\n   ========================================================================== */\n\n/* Highlighted author name inside a PublicationCard's author list. */\n.ymds-authors strong { color: var(--accent-red); font-weight: 700; }\n\n/* Generic scholar-blue link treatment, matching the site's anchors. */\n.ymds-link { color: var(--link); text-decoration: underline; transition: var(--transition); }\n.ymds-link:hover { color: var(--link-hover); }\n\n/* Social rail links underline on hover (matches the sidebar). */\n.ymds-social-link:hover { text-decoration: underline; }\n\n\n/* Academicons glyph classes (.ai-orcid, .ai-google-scholar, .ai-dblp …) */\n.ai-ul,.fa-ul{list-style-type:none}.ai-li,.fa-li{top:.14285714em;text-align:center}.ai-fw,.ai-li,.fa-fw,.fa-li{text-align:center}.ai.fa-pull-left,.fa.fa-pull-left{margin-right:.3em}@font-face{font-family:Academicons;src:url(\"cc29f226-acca-4c9f-809e-2b4956cadab3\") format('woff'),url(\"44b7b061-5fa2-41c7-9c94-09e2f9b71e5f\") format('truetype');font-weight:400;font-style:normal}.ai{display:inline-block;font:normal normal normal 14px/1 Academicons;font-size:inherit;text-rendering:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.ai-lg,.fa-lg{line-height:.75em;vertical-align:-15%}.ai-academia:before{content:\"\\e800\"}.ai-academia-square:before{content:\"\\e801\"}.ai-acclaim:before{content:\"\\e802\"}.ai-acclaim-square:before{content:\"\\e803\"}.ai-acm:before{content:\"\\e804\"}.ai-acm-square:before{content:\"\\e805\"}.ai-ads:before{content:\"\\e806\"}.ai-ads-square:before{content:\"\\e807\"}.ai-arxiv:before{content:\"\\e808\"}.ai-arxiv-square:before{content:\"\\e809\"}.ai-biorxiv:before{content:\"\\e810\"}.ai-biorxiv-square:before{content:\"\\e811\"}.ai-ceur:before{content:\"\\e812\"}.ai-ceur-box:before{content:\"\\e813\"}.ai-courser:before{content:\"\\e814\"}.ai-courser-square:before{content:\"\\e815\"}.ai-dataverse:before{content:\"\\e816\"}.ai-dataverse-box:before{content:\"\\e817\"}.ai-dblp:before{content:\"\\e818\"}.ai-dblp-square:before{content:\"\\e819\"}.ai-depsy:before{content:\"\\e820\"}.ai-depsy-square:before{content:\"\\e821\"}.ai-doi:before{content:\"\\e822\"}.ai-doi-square:before{content:\"\\e823\"}.ai-dryad:before{content:\"\\e824\"}.ai-dryad-square:before{content:\"\\e825\"}.ai-figshare:before{content:\"\\e826\"}.ai-figshare-square:before{content:\"\\e827\"}.ai-google-scholar:before{content:\"\\e828\"}.ai-google-scholar-square:before{content:\"\\e829\"}.ai-ieee:before{content:\"\\e830\"}.ai-ieee-square:before{content:\"\\e831\"}.ai-impactstory:before{content:\"\\e832\"}.ai-impactstory-square:before{content:\"\\e833\"}.ai-inspire:before{content:\"\\e834\"}.ai-inspire-square:before{content:\"\\e835\"}.ai-mendeley:before{content:\"\\e836\"}.ai-mendeley-square:before{content:\"\\e837\"}.ai-open-access:before{content:\"\\e838\"}.ai-open-access-square:before{content:\"\\e839\"}.ai-orcid:before{content:\"\\e840\"}.ai-orcid-square:before{content:\"\\e841\"}.ai-osf:before{content:\"\\e842\"}.ai-osf-square:before{content:\"\\e843\"}.ai-overleaf:before{content:\"\\e844\"}.ai-overleaf-square:before{content:\"\\e845\"}.ai-philpapers:before{content:\"\\e846\"}.ai-philpapers-square:before{content:\"\\e847\"}.ai-piazza:before{content:\"\\e848\"}.ai-piazza-square:before{content:\"\\e849\"}.ai-publons:before{content:\"\\e850\"}.ai-publons-square:before{content:\"\\e851\"}.ai-pubmed:before{content:\"\\e852\"}.ai-pubmed-square:before{content:\"\\e853\"}.ai-researchgate:before{content:\"\\e854\"}.ai-researchgate-square:before{content:\"\\e855\"}.ai-scirate:before{content:\"\\e856\"}.ai-scirate-square:before{content:\"\\e857\"}.ai-springer:before{content:\"\\e858\"}.ai-springer-square:before{content:\"\\e859\"}.ai-zotero:before{content:\"\\e860\"}.ai-zotero-square:before{content:\"\\e861\"}.ai-lg{font-size:1.33333333em}.ai-2x{font-size:2em}.ai-3x{font-size:3em}.ai-4x{font-size:4em}.ai-5x{font-size:5em}.ai-fw{width:1.28571429em}.ai-ul{padding-left:0;margin-left:2.14285714em}.ai-ul>li{position:relative}.ai-li{position:absolute;left:-2.14285714em;width:2.14285714em}.ai-li.fa-lg{left:-1.85714286em}.ai-border{padding:.2em .25em .15em;border:.08em solid #eee;border-radius:.1em}.ai-pull-left{float:left}.ai-pull-right{float:right}.ai.fa-pull-right{margin-left:.3em}.fa-lg{font-size:1.33333333em}.fa-2x{font-size:2em}.fa-3x{font-size:3em}.fa-4x{font-size:4em}.fa-5x{font-size:5em}.fa-fw{width:1.28571429em}.fa-ul{padding-left:0;margin-left:2.14285714em}.fa-ul>li{position:relative}.fa-li{position:absolute;left:-2.14285714em;width:2.14285714em}.fa-li.fa-lg{left:-1.85714286em}.fa-border{padding:.2em .25em .15em;border:.08em solid #eee;border-radius:.1em}.fa-pull-left{float:left}.fa-pull-right{float:right}.fa.fa-pull-right{margin-left:.3em}\n<\u002Fstyle>\n  <script src=\"eb965196-d6de-41bd-bf26-975e6e474b07\"><\u002Fscript>\n  <script src=\"e83389e9-5b5a-461b-8301-5fd7b0dd6042\"><\u002Fscript>\n  <title>Lossless KV Cache Compression — Yu Mao<\u002Ftitle>\n  <style>\n    html, body { margin: 0; background: #fff; }\n    body { font-family: \"Trebuchet MS\", Helvetica, sans-serif; font-size: 15px; line-height: 1.6; color: #494e52; -webkit-font-smoothing: antialiased; }\n    a { color: #224b8d; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }\n    a:hover { color: #1a3869; }\n    code { font-family: Monaco, Consolas, monospace; font-size: 0.86em; background: #fafafa; border: 1px solid #f2f2f3; border-radius: 3px; padding: 1px 5px; }\n    @keyframes ymIntro { from { opacity: 0; } to { opacity: 1; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh; background:#fff; animation:ymIntro 0.3s ease-in-out;\">\n\n  <div style=\"position:sticky; top:0; z-index:10; background:rgba(255,255,255,0.97);\">\n    <x-import component-from-global-scope=\"YuMaoHomepageDesignSystem_30a886.Masthead\" home=\"Yu Mao\" home-href=\"https://mynotwo.github.io/\" links=\"{{ navLinks }}\" hint-size=\"100%,42px\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <main style=\"max-width:920px; margin:0 auto; padding:0 28px 96px; box-sizing:border-box;\">\n\n    <!-- HERO -->\n    <header data-screen-label=\"Hero\" style=\"padding:64px 0 40px; border-bottom:1px solid #f2f2f3;\">\n      <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288; margin-bottom:18px;\">Compressing Inference State · AI Infra / Inference Systems<\u002Fdiv>\n      <h1 style=\"font-size:44px; line-height:1.1; font-weight:700; color:#1a1a1a; margin:0 0 20px; letter-spacing:-0.01em; text-wrap:balance;\">Lossless KV Cache Compression<\u002Fh1>\n      <p style=\"font-size:19px; line-height:1.55; color:#313436; margin:0 0 14px; max-width:720px; text-wrap:pretty;\"><strong style=\"color:#1a1a1a;\">KV cache is not a homogeneous byte stream.<\u002Fstrong> Representation and layout determine how much redundancy a lossless codec can recover; structure-aware preprocessing outperforms direct generic compression.<\u002Fp>\n      <p style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:15px; color:#7a8288; margin:0 0 40px;\">A representation-aware coding benchmark<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0; border-top:1px solid #1a1a1a; border-bottom:1px solid #f2f2f3;\">\n        <div style=\"padding:22px 20px 20px 0;\">\n          <div style=\"font-size:46px; font-weight:700; color:#224b8d; line-height:1; letter-spacing:-0.02em;\">1.52×<\u002Fdiv>\n          <div style=\"font-weight:600; color:#1a1a1a; margin-top:10px;\">Median best ratio<\u002Fdiv>\n          <div style=\"font-size:13px; color:#7a8288;\">BF16 KV · real text · 18 samples<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px 20px 20px; border-left:1px solid #f2f2f3;\">\n          <div style=\"font-size:46px; font-weight:700; color:#1a1a1a; line-height:1; letter-spacing:-0.02em;\">1.51–1.53×<\u002Fdiv>\n          <div style=\"font-weight:600; color:#1a1a1a; margin-top:10px;\">Measured range<\u002Fdiv>\n          <div style=\"font-size:13px; color:#7a8288;\">English, Chinese, code · 2K and 8K<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 0 20px 20px; border-left:1px solid #f2f2f3;\">\n          <div style=\"font-size:46px; font-weight:700; color:#1a1a1a; line-height:1; letter-spacing:-0.02em;\">34.4%<\u002Fdiv>\n          <div style=\"font-weight:600; color:#1a1a1a; margin-top:10px;\">Median payload reduction<\u002Fdiv>\n          <div style=\"font-size:13px; color:#7a8288;\">Derived from the 1.52× ratio<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <dl style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px 28px; margin:24px 0 0; font-size:13.5px;\">\n        <div><dt style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Model<\u002Fdt><dd style=\"margin:2px 0 0; color:#313436;\">Qwen2.5-7B<\u002Fdd><\u002Fdiv>\n        <div><dt style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Context<\u002Fdt><dd style=\"margin:2px 0 0; color:#313436;\">2K / 8K<\u002Fdd><\u002Fdiv>\n        <div><dt style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Inputs<\u002Fdt><dd style=\"margin:2px 0 0; color:#313436;\">ShareGPT, Chinese Wikipedia, CPython source; no document reused<\u002Fdd><\u002Fdiv>\n        <div><dt style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Check<\u002Fdt><dd style=\"margin:2px 0 0; color:#313436;\">Every blob decoded byte for byte<\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-top:32px;\">\n        <div style=\"background:#fafafa; border:1px solid #f2f2f3; border-radius:4px; padding:14px 16px; font-size:13.5px; line-height:1.55;\"><strong style=\"color:#1a1a1a;\">Lossless scope.<\u002Fstrong> BF16 and FP32 round-trip the selected representation. FP16, FP8, and INT are lossless only after representation conversion — not against the original KV tensor.<\u002Fdiv>\n        <div style=\"background:#fafafa; border:1px solid #f2f2f3; border-radius:4px; padding:14px 16px; font-size:13.5px; line-height:1.55;\"><strong style=\"color:#1a1a1a;\">Evidence scope.<\u002Fstrong> The 2-model, 50-point matrix below repeats one paragraph to fill the context, which overstates ratios (1.71× there vs 1.52× on real text). A separate Qwen2.5-14B BF16 run adds codec throughput and KV read-path measurements.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- 01 -->\n    <section id=\"finding\" data-screen-label=\"01 Core finding\" style=\"padding-top:64px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1px solid #f2f2f3; padding-bottom:14px; margin-bottom:28px;\">\n        <span style=\"font-family:Monaco, Consolas, monospace; font-size:13px; color:#8b2c2c;\">01<\u002Fspan>\n        <span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288;\">Core finding<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size:30px; line-height:1.2; color:#1a1a1a; margin:0 0 14px; text-wrap:balance;\">KV cache is structured state, not opaque bytes<\u002Fh2>\n      <p style=\"font-size:16px; margin:0 0 32px; max-width:700px; text-wrap:pretty;\">The strongest evidence is a matched-codec ablation: the same BF16 KV payload and the same Zstd-1 codec compress differently after layout-aware preprocessing.<\u002Fp>\n\n      <figure style=\"margin:0 0 20px; border:1px solid #efefef; border-radius:4px; padding:28px 28px 22px;\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:28px; align-items:center; margin-bottom:28px;\">\n          <div>\n            <div style=\"display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;\">\n              <span style=\"font-size:40px; font-weight:700; color:#bdc1c4; line-height:1;\">1.29×<\u002Fspan>\n              <span style=\"font-size:24px; color:#bdc1c4;\">→<\u002Fspan>\n              <span style=\"font-size:40px; font-weight:700; color:#224b8d; line-height:1;\">1.48×<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-weight:600; color:#1a1a1a; margin-top:10px;\">Raw Zstd-1 → ByteSplit + Zstd-1<\u002Fdiv>\n            <div style=\"font-size:13px; color:#7a8288;\">Median across 18 real-text BF16 KV samples<\u002Fdiv>\n          <\u002Fdiv>\n          <blockquote style=\"margin:0; padding:0 0 0 20px; border-left:1px solid #bdc1c4; font-family:Georgia, Times, serif; font-style:italic; font-size:17px; line-height:1.5; color:#313436;\">Rearranging the same payload changes how much redundancy a generic codec can exploit.<\u002Fblockquote>\n        <\u002Fdiv>\n\n        <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288; margin-bottom:12px;\">BF16 real text · median compression ratio by method<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px;\">\n          <sc-for list=\"{{ methods }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:minmax(120px, 210px) minmax(0, 1fr) 52px; align-items:center; gap:12px; font-size:13.5px;\">\n              <div style=\"color:#313436; text-align:right;\">{{ m.name }}<\u002Fdiv>\n              <div style=\"position:relative; height:18px; background:#fafafa;\">\n                <div style=\"position:absolute; left:0; top:0; bottom:0; width:{{ m.w }}; background:{{ m.color }}; border-radius:0 2px 2px 0;\"><\u002Fdiv>\n                <div style=\"position:absolute; top:-4px; bottom:-4px; left:{{ baseline }}; border-left:1px dashed #7a8288;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-weight:600; color:{{ m.text }}; font-variant-numeric:tabular-nums;\">{{ m.v }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <figcaption style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:13px; color:#7a8288; margin-top:14px;\">Dashed line marks 1.0× (no compression). Compression policy = representation + layout + codec.<\u002Ffigcaption>\n      <\u002Ffigure>\n      <p style=\"font-size:15px; margin:0 0 56px; max-width:700px; text-wrap:pretty;\">On real text the best structure-aware BF16 ratio is <strong style=\"color:#1a1a1a;\">1.52×<\u002Fstrong>, <strong style=\"color:#1a1a1a;\">18%<\u002Fstrong> above raw Zstd-1. Floating-point compressors on the same tensors do worse.<\u002Fp>\n\n      <div style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288; margin-bottom:20px;\">Evidence<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:40px; margin-bottom:56px;\">\n        <div>\n          <h3 style=\"font-size:18px; color:#8b2c2c; margin:0 0 6px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Model matters<\u002Fh3>\n          <p style=\"font-size:14px; margin:0 0 16px; text-wrap:pretty;\">Same dtype, contexts, inputs, and method family — different ratios. Compression policy should be model-aware, not globally fixed.<\u002Fp>\n          <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums;\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"border-bottom:1px solid #1a1a1a;\">\n                <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:6px 0;\">Model<\u002Fsc-raw-th>\n                <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">512<\u002Fsc-raw-th>\n                <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">2,048<\u002Fsc-raw-th>\n                <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">8,192<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr style=\"border-bottom:1px solid #efefef;\"><sc-raw-td style=\"padding:9px 0; color:#313436;\">Qwen2.5-7B<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">1.56×<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">1.73×<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-weight:600; color:#224b8d;\">1.86×<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr style=\"border-bottom:1px solid #efefef;\"><sc-raw-td style=\"padding:9px 0; color:#313436;\">Qwen3-8B<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">1.52×<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">1.66×<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-weight:600; color:#224b8d;\">1.78×<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n\n        <div>\n          <h3 style=\"font-size:18px; color:#8b2c2c; margin:0 0 6px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Context barely matters on real text<\u002Fh3>\n          <p style=\"font-size:14px; margin:0 0 16px; text-wrap:pretty;\">With repeated-paragraph inputs the ratio climbs with context. On real text, 8K compresses only 0.4% better than 2K — the climb came from the repetition.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ ctxBars }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:96px minmax(0, 1fr) 46px; align-items:center; gap:10px; font-size:13px;\">\n                <div style=\"color:#313436;\">{{ c.name }}<\u002Fdiv>\n                <div style=\"height:14px; background:#fafafa;\"><div style=\"height:100%; width:{{ c.w }}; background:{{ c.color }};\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"font-weight:600; color:#1a1a1a; font-variant-numeric:tabular-nums;\">{{ c.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:12.5px; color:#7a8288; margin-top:10px;\">Repeated-paragraph inputs · median KVPress-LZMA ratio across five input types<\u002Fdiv>\n          <div style=\"margin-top:14px; font-size:13px; padding:10px 12px; background:#fafafa; border-radius:4px;\">Qwen2.5-14B · BF16 · final Zstd-1 pipeline: <strong style=\"color:#1a1a1a;\">2K 1.55× → 32K 1.68×<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"font-size:18px; color:#8b2c2c; margin:0 0 6px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Representation matters<\u002Fh3>\n      <p style=\"font-size:14px; margin:0 0 16px; max-width:700px; text-wrap:pretty;\">Repeated-paragraph matrix. Ratios vary sharply by dtype, but their denominators are format-specific: representation changes entropy structure — the largest ratio is not automatically the best serving choice.<\u002Fp>\n      <div style=\"overflow-x:auto; overflow-y:hidden;\">\n        <sc-raw-table style=\"width:100%; min-width:560px; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums;\">\n          <sc-raw-thead>\n            <sc-raw-tr style=\"border-bottom:1px solid #1a1a1a;\">\n              <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:6px 12px 6px 0;\">Representation<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 20px 6px 0;\">Median best ratio<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:6px 12px 6px 0;\">Correctness scope<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:6px 0;\">Interpretation<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ reps }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <sc-raw-tr style=\"border-bottom:1px solid #efefef; background:{{ r.bg }};\">\n                <sc-raw-td style=\"padding:11px 12px 11px 0; font-weight:600; color:#1a1a1a;\">{{ r.name }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 20px 11px 0; text-align:right;\">{{ r.ratio }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 12px 11px 0;\"><span style=\"display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:3px; background:{{ r.chipBg }}; color:{{ r.chipText }}; white-space:nowrap;\">{{ r.scope }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:11px 0; color:#494e52;\">{{ r.note }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; margin:16px 0 0; color:#666;\"><strong style=\"color:#1a1a1a;\">K/V note.<\u002Fstrong> Measured BF16 medians are close (K 1.68×, V 1.74×). This dataset does not justify separate production policies, but K and V should remain observable.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- 02 -->\n    <section id=\"systems\" data-screen-label=\"02 Systems implication\" style=\"padding-top:80px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1px solid #f2f2f3; padding-bottom:14px; margin-bottom:28px;\">\n        <span style=\"font-family:Monaco, Consolas, monospace; font-size:13px; color:#8b2c2c;\">02<\u002Fspan>\n        <span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288;\">Systems implication<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size:30px; line-height:1.2; color:#1a1a1a; margin:0 0 14px;\">When is compression actually useful?<\u002Fh2>\n      <p style=\"font-size:16px; margin:0 0 28px; max-width:700px;\">Only when codec work costs less than the transfer time saved by moving fewer bytes.<\u002Fp>\n\n      <div style=\"border-top:1px solid #f2f2f3; border-bottom:1px solid #f2f2f3; padding:36px 0 28px; text-align:center; margin-bottom:56px;\">\n        <div style=\"font-family:Georgia, Times, serif; font-size:32px; color:#1a1a1a; display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap;\">\n          <span><i>T<\u002Fi><sub style=\"font-size:0.5em; font-style:normal;\">codec<\u002Fsub><\u002Fspan>\n          <span style=\"color:#7a8288;\">&lt;<\u002Fspan>\n          <span style=\"display:inline-flex; flex-direction:column; align-items:center; line-height:1.1;\"><i>S<\u002Fi><span style=\"display:block; width:100%; border-top:1.5px solid #1a1a1a; margin:3px 0;\"><\u002Fspan><i>B<\u002Fi><\u002Fspan>\n          <span>(1 − <span style=\"display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.1; font-size:0.8em;\">1<span style=\"display:block; width:100%; border-top:1.5px solid #1a1a1a; margin:2px 0;\"><\u002Fspan><i>R<\u002Fi><\u002Fspan>)<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:13px; color:#7a8288; margin-top:22px; display:flex; justify-content:center; gap:8px 22px; flex-wrap:wrap;\">\n          <span><i style=\"font-family:Georgia, serif; color:#1a1a1a;\">S<\u002Fi> uncompressed bytes<\u002Fspan>\n          <span><i style=\"font-family:Georgia, serif; color:#1a1a1a;\">B<\u002Fi> effective transfer bandwidth<\u002Fspan>\n          <span><i style=\"font-family:Georgia, serif; color:#1a1a1a;\">R<\u002Fi> compression ratio<\u002Fspan>\n          <span><i style=\"font-family:Georgia, serif; color:#1a1a1a;\">T<\u002Fi><sub>codec<\u002Fsub> codec time on that path<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"font-size:22px; color:#1a1a1a; margin:0 0 10px; line-height:1.3; text-wrap:balance;\">About 40% less KV memory, with no meaningful read-latency penalty<\u002Fh3>\n      <p style=\"font-size:15px; margin:0 0 24px; max-width:700px; text-wrap:pretty;\">At 1.672× compression, the KV payload uses 59.8% of its original bytes. On real KV reads, the compressed path took 95–101% of baseline time: about 5% faster at best and 1% slower at worst.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); border-top:1px solid #1a1a1a; margin-bottom:10px;\">\n        <div style=\"padding:20px 20px 18px 0;\"><div style=\"font-size:38px; font-weight:700; color:#224b8d; line-height:1;\">40.2%<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">KV payload memory reduction<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 20px 18px; border-left:1px solid #f2f2f3;\"><div style=\"font-size:38px; font-weight:700; color:#1a1a1a; line-height:1;\">3.5 GB/s<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">Zstd compression · 8 threads<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 0 18px 20px; border-left:1px solid #f2f2f3;\"><div style=\"font-size:38px; font-weight:700; color:#1a1a1a; line-height:1;\">−5% to +1%<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">Real KV read latency vs uncompressed<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:13px; color:#7a8288; margin-bottom:40px;\">Qwen2.5-14B · BF16 · Zstd-1 ratio 1.672× at ≈5K tokens · full reconstruction ≈4 GB/s at 16 threads · full host pipeline plateaued near 1 GB/s<\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:28px; margin-bottom:28px;\">\n        <div><div style=\"font-weight:700; color:#1a1a1a; margin-bottom:4px;\">Memory footprint<\u002Fdiv><div style=\"font-size:14px;\">The selected KV payload was 40.2% smaller. Allocator overhead and end-to-end GPU memory savings were not measured.<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight:700; color:#1a1a1a; margin-bottom:4px;\">Offload traffic<\u002Fdiv><div style=\"font-size:14px;\">Host, remote, and storage tiers move encoded state instead of the full selected representation.<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight:700; color:#1a1a1a; margin-bottom:4px;\">State migration<\u002Fdiv><div style=\"font-size:14px;\">Disaggregated prefill/decode and long-running agents make state movement a first-class systems path.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; color:#666; margin:0; padding:12px 16px; background:#fafafa; border-radius:4px;\"><strong style=\"color:#1a1a1a;\">Measured conclusion.<\u002Fstrong> The selected KV payload is about 40% smaller, compression throughput can scale to the generation rate, and real KV read latency is essentially unchanged. End-to-end serving capacity and concurrency gains were not measured.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- 03 -->\n    <section id=\"serving\" data-screen-label=\"03 Serving system\" style=\"padding-top:80px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1px solid #f2f2f3; padding-bottom:14px; margin-bottom:28px;\">\n        <span style=\"font-family:Monaco, Consolas, monospace; font-size:13px; color:#8b2c2c;\">03<\u002Fspan>\n        <span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288;\">In a serving system<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size:30px; line-height:1.2; color:#1a1a1a; margin:0 0 14px;\">Restoring a 256K-token context in 64 ms<\u002Fh2>\n      <p style=\"font-size:16px; margin:0 0 36px; max-width:720px; text-wrap:pretty;\">A KV cache offloading connector for AIBrix and unmodified vLLM, for hybrid models that mix linear-attention (Mamba-style) and full-attention layers. In multi-turn sessions, a context evicted from GPU memory is restored from host memory instead of being prefilled again.<\u002Fp>\n\n      <figure style=\"margin:0 0 28px; border:1px solid #efefef; border-radius:4px; padding:28px 28px 22px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px;\">\n          <div>\n            <div style=\"font-size:18px; font-weight:700; color:#1a1a1a; line-height:1.3;\">Time to first token at 256K: 0.44 s restored vs 11–15 s recomputed<\u002Fdiv>\n            <div style=\"font-size:13px; color:#7a8288; margin-top:4px;\">Seconds · by prompt length<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; font-size:12.5px; color:#494e52;\">\n            <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:10px; height:10px; background:#bdc1c4;\"><\u002Fspan>Recompute<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:10px; height:10px; background:#224b8d;\"><\u002Fspan>Restore<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <sc-for list=\"{{ ttft }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:44px minmax(0, 1fr); gap:12px; align-items:center;\">\n              <div style=\"font-size:13px; font-weight:600; color:#1a1a1a; text-align:right; font-variant-numeric:tabular-nums;\">{{ t.p }}<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:3px;\">\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <div style=\"display:flex; height:11px; width:{{ t.recW }};\"><div style=\"height:100%; width:{{ t.recLoPct }}; background:#bdc1c4;\"><\u002Fdiv><div style=\"height:100%; flex:1; background:#e3e5e7;\"><\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size:12px; color:#7a8288; white-space:nowrap; font-variant-numeric:tabular-nums;\">{{ t.rec }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <div style=\"height:11px; width:{{ t.resW }}; min-width:2px; background:#224b8d;\"><\u002Fdiv>\n                  <span style=\"font-size:12px; color:#224b8d; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums;\">{{ t.res }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <figcaption style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:13px; color:#7a8288; margin-top:16px;\">{{ ttftCaption }}<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <p style=\"font-size:15px; margin:0 0 28px; max-width:720px; text-wrap:pretty;\">Restore time grows linearly with the prompt: about 0.25 ms per 1K tokens with GPU ANS compression, 0.33 ms without. Above 32K it is bound by host-to-device PCIe bandwidth, so compression shortens the restore only when it decodes on the GPU.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); border-top:1px solid #1a1a1a; margin-bottom:10px;\">\n        <div style=\"padding:20px 20px 18px 0;\"><div style=\"font-size:38px; font-weight:700; color:#224b8d; line-height:1;\">25–33×<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">Faster time to first token than recompute at 256K<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 20px 18px; border-left:1px solid #f2f2f3;\"><div style=\"font-size:38px; font-weight:700; color:#1a1a1a; line-height:1;\">−24%<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">Restore window with GPU ANS (ratio 1.34) vs raw, at 256K<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 0 18px 20px; border-left:1px solid #f2f2f3;\"><div style=\"font-size:38px; font-weight:700; color:#1a1a1a; line-height:1;\">1.4×<\u002Fdiv><div style=\"font-size:13.5px; color:#313436; margin-top:8px;\">Raw restore vs the PCIe copy lower bound, above 128K<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:13px; color:#7a8288; margin-bottom:32px;\">Qwen3.8-Flash-Next · TP8 · 8×H800 · vLLM 0.30 · AIBrix in-memory backend · 6 prompts per length · restore window = first record read to last block written, over all 8 GPUs<\u002Fdiv>\n\n      <div style=\"overflow-x:auto; margin-bottom:44px;\">\n        <sc-raw-table style=\"width:100%; min-width:600px; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums;\">\n          <sc-raw-thead>\n            <sc-raw-tr style=\"border-bottom:1px solid #1a1a1a;\">\n              <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:6px 0;\">Prompt<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">Recompute<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">Restore (TTFT)<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">Window · raw<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; font-weight:600; color:#1a1a1a; padding:6px 0;\">Window · GPU ANS<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ ttft }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <sc-raw-tr style=\"border-bottom:1px solid #efefef;\">\n                <sc-raw-td style=\"padding:9px 0; font-weight:600; color:#1a1a1a;\">{{ t.p }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; color:#7a8288;\">{{ t.rec }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; color:#1a1a1a;\">{{ t.res }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right;\">{{ t.raw }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-weight:600; color:#224b8d;\">{{ t.ans }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:32px; margin-bottom:28px;\">\n        <div>\n          <h3 style=\"font-size:16px; color:#8b2c2c; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Codec placement decides<\u002Fh3>\n          <p style=\"font-size:14px; margin:0; text-wrap:pretty;\">CPU zstd (ratio 1.22) made every restore slower: 32 ms vs 6.7 ms at 8K. nvCOMP ANS on the GPU, in 64 MB frames pipelined with the copy, cut 15–25% instead. Byte split on the GPU lifts ANS from 1.22× to 1.43×, but decode falls from 47 to 19 GB/s, below PCIe — so the connector keeps ANS on raw bytes.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:16px; color:#8b2c2c; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Where the time went<\u002Fh3>\n          <p style=\"font-size:14px; margin:0; text-wrap:pretty;\">At 128K: per-layer <code>index_copy_<\u002Fcode> write-back 23 → 4.3 ms; NUMA-local host memory lifted the slowest GPU from 23 to 47 GB/s; GPU checksum in fixed 128 MB slices.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:16px; color:#8b2c2c; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid rgba(210,105,30,0.35);\">Fails safe<\u002Fh3>\n          <p style=\"font-size:14px; margin:0; text-wrap:pretty;\">A missing, corrupted or mismatched record, or a GPU out-of-memory, falls back to recompute. Saves never block the engine: when 4 are in flight, a new one is dropped.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; color:#666; margin:0; padding:12px 16px; background:#fafafa; border-radius:4px;\"><strong style=\"color:#1a1a1a;\">Measured scope.<\u002Fstrong> One machine, in-memory backend, synthetic prompts. A multi-turn video test (TikTok clips and 34–114 min videos, 7.6K–177K tokens) restored faster than recompute in 15 of 16 sessions, 2.2–4.7× by length on turns 2–3. Below 10 ms only at 8K (6.2 ms); longer contexts are bounded by PCIe. Distributed storage and capacity gains from compression were not measured.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- 04 -->\n    <section id=\"boundaries\" data-screen-label=\"04 Benchmark + boundaries\" style=\"padding-top:80px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1px solid #f2f2f3; padding-bottom:14px; margin-bottom:28px;\">\n        <span style=\"font-family:Monaco, Consolas, monospace; font-size:13px; color:#8b2c2c;\">04<\u002Fspan>\n        <span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#7a8288;\">Benchmark + boundaries<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size:30px; line-height:1.2; color:#1a1a1a; margin:0 0 14px;\">The measurement matrix and its limits<\u002Fh2>\n      <p style=\"font-size:16px; margin:0 0 28px; max-width:700px;\">The main story stays on BF16. The full matrix and the technical boundaries behind the claims remain available here.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:18px 24px; padding:20px 0; border-top:1px solid #f2f2f3; border-bottom:1px solid #f2f2f3; margin-bottom:48px; font-size:13.5px;\">\n        <div><div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Models<\u002Fdiv><div style=\"color:#313436;\">Qwen2.5-7B · Qwen3-8B<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Contexts<\u002Fdiv><div style=\"color:#313436;\">512 · 1K · 2K · 4K · 8K<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Inputs<\u002Fdiv><div style=\"color:#313436;\">English · code · math · Chinese · JSON<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Representations<\u002Fdiv><div style=\"color:#313436;\">BF16 · FP16 · FP32 · FP8 ×2 · INT8/4/2<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">Batch / hardware<\u002Fdiv><div style=\"color:#7a8288;\">Not recorded<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"explorer\" data-screen-label=\"04 Explorer\" style=\"margin-bottom:64px;\">\n        <h3 style=\"font-size:20px; color:#1a1a1a; margin:0 0 6px;\">Benchmark explorer<\u002Fh3>\n        <p style=\"font-size:14px; margin:0 0 20px; max-width:700px;\">Median compression ratio per method and context length. Repeated-paragraph inputs; pick a slice.<\u002Fp>\n\n        <div style=\"display:flex; flex-direction:column; gap:10px; padding:16px 0; border-top:1px solid #1a1a1a; border-bottom:1px solid #f2f2f3; margin-bottom:20px;\">\n          <sc-for list=\"{{ controls }}\" as=\"ctl\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid; grid-template-columns:96px minmax(0, 1fr); gap:12px; align-items:center;\">\n              <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#7a8288;\">{{ ctl.label }}<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n                <sc-for list=\"{{ ctl.opts }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"font-family:inherit; font-size:12.5px; padding:3px 11px; border-radius:3px; cursor:pointer; transition:all 0.2s ease-in-out; border:1px solid {{ o.border }}; background:{{ o.bg }}; color:{{ o.color }}; font-weight:{{ o.weight }};\" style-hover=\"border-color:#888;\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;\">\n          <div style=\"display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:#494e52;\">\n            <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:#bdc1c4;\"><\u002Fspan>Raw codec<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:#5a6fa8;\"><\u002Fspan>Single preprocess<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:6px;\"><span style=\"width:10px; height:10px; border-radius:2px; background:#8b2c2c;\"><\u002Fspan>Structure-aware pipeline (KVPress)<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleRows }}\" style=\"font-family:inherit; font-size:13px; color:#224b8d; background:none; border:none; padding:4px 0; cursor:pointer;\" style-hover=\"color:#1a3869; text-decoration:underline;\">{{ rowsLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"overflow-x:auto; overflow-y:hidden;\">\n          <sc-raw-table style=\"width:100%; min-width:560px; border-collapse:separate; border-spacing:0 3px; font-size:13.5px; font-variant-numeric:tabular-nums;\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th style=\"text-align:left; font-weight:600; color:#1a1a1a; padding:4px 12px 8px 0; border-bottom:1px solid #1a1a1a; width:32%;\">Method<\u002Fsc-raw-th>\n                <sc-for list=\"{{ ctxCols }}\" as=\"cc\" hint-placeholder-count=\"5\">\n                  <sc-raw-th style=\"text-align:center; font-weight:600; color:#1a1a1a; padding:4px 0 8px; border-bottom:1px solid #1a1a1a;\">{{ cc }}<\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ matrix }}\" as=\"row\" hint-placeholder-count=\"8\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"padding:6px 12px 6px 0; color:#1a1a1a;\">\n                    <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"width:3px; height:16px; border-radius:1px; background:{{ row.dot }}; flex-shrink:0;\"><\u002Fspan><span style=\"font-weight:{{ row.weight }};\">{{ row.name }}<\u002Fspan><span style=\"font-size:11px; color:#7a8288;\">{{ row.rank }}<\u002Fspan><\u002Fspan>\n                  <\u002Fsc-raw-td>\n                  <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"5\">\n                    <sc-raw-td sc-camel-on-mouse-enter=\"{{ cell.enter }}\" sc-camel-on-mouse-move=\"{{ cell.move }}\" sc-camel-on-mouse-leave=\"{{ cell.leave }}\" style=\"text-align:center; padding:6px 4px; cursor:default; background:{{ cell.bg }}; color:{{ cell.fg }}; font-weight:{{ cell.weight }};\">{{ cell.v }}<\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <div style=\"font-family:Georgia, Times, serif; font-style:italic; font-size:13px; color:#7a8288; margin-top:12px;\">{{ explorerCaption }} Hover a cell for exact K / V values.<\u002Fdiv>\n        <sc-if value=\"{{ hasTip }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed; left:{{ tip.left }}; top:{{ tip.top }}; z-index:50; width:220px; pointer-events:none; background:#fff; border:1px solid #f2f2f3; border-radius:4px; box-shadow:0 0 10px rgba(0,0,0,0.25); padding:12px 14px; font-size:13px;\">\n            <div style=\"font-weight:700; color:{{ tip.color }}; font-size:14px;\">{{ tip.name }}<\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#7a8288; margin:2px 0 10px;\">{{ tip.sub }}<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-variant-numeric:tabular-nums;\">\n              <span style=\"color:#7a8288;\">K + V<\u002Fspan><span style=\"text-align:right; font-weight:600; color:#1a1a1a;\">{{ tip.kv }}<\u002Fspan>\n              <span style=\"color:#7a8288;\">K<\u002Fspan><span style=\"text-align:right; color:#1a1a1a;\">{{ tip.k }}<\u002Fspan>\n              <span style=\"color:#7a8288;\">V<\u002Fspan><span style=\"text-align:right; color:#1a1a1a;\">{{ tip.v }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#494e52; margin-top:10px; padding-top:8px; border-top:1px solid #efefef;\">{{ tip.rank }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:8px;\">\n        <h3 style=\"font-size:20px; color:#1a1a1a; margin:0;\">Technical deep dive<\u002Fh3>\n        <button sc-camel-on-click=\"{{ toggleAll }}\" style=\"font-family:inherit; font-size:13px; color:#224b8d; background:none; border:none; padding:4px 0; cursor:pointer;\" style-hover=\"color:#1a3869; text-decoration:underline;\">{{ toggleLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #efefef;\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"12\">\n          <div style=\"border-bottom:1px solid #efefef;\">\n            <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%; display:flex; justify-content:space-between; align-items:center; gap:16px; text-align:left; font-family:inherit; font-size:15px; font-weight:600; color:#1a1a1a; background:none; border:none; padding:15px 0; cursor:pointer;\" style-hover=\"color:#224b8d;\">\n              <span>{{ f.q }}<\u002Fspan>\n              <span style=\"font-family:Monaco, Consolas, monospace; font-weight:400; color:#7a8288; font-size:16px; flex-shrink:0;\">{{ f.icon }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0; padding:0 40px 18px 0; font-size:14.5px; line-height:1.6; max-width:720px; text-wrap:pretty;\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"margin-top:80px; padding-top:20px; border-top:1px solid #f2f2f3; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:#7a8288;\">\n      <span>© Yu Mao · <a href=\"https://mynotwo.github.io/\">mynotwo.github.io<\u002Fa><\u002Fspan>\n      <span style=\"font-family:Georgia, Times, serif; font-style:italic;\">Do small things with great love!<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;faqExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;ttftScale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;linear&quot;,&quot;log&quot;],&quot;default&quot;:&quot;linear&quot;,&quot;tsType&quot;:&quot;'linear'|'log'&quot;,&quot;section&quot;:&quot;Charts&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: {}, mx: null, sel: { format: 'bf16', model: 'Qwen2.5-7B', input: 'all', component: 'KV' }, showAll: false };\n  componentDidMount() {\n    if (window.KV_MATRIX) { this.setState({ mx: window.KV_MATRIX }); return; }\n    fetch('kv-matrix.json').then(r => r.json()).then(mx => this.setState({ mx })).catch(() => {});\n  }\n  explorerVals() {\n    const { mx, sel, showAll } = this.state;\n    const F = [['bf16','BF16'],['fp16','FP16'],['fp32','FP32'],['fp8_e4m3','FP8-E4M3'],['fp8_e5m2','FP8-E5M2'],['int8','INT8'],['int4','INT4'],['int2','INT2']];\n    const groups = { format: F, model: [['Qwen2.5-7B','Qwen2.5-7B'],['Qwen3-8B','Qwen3-8B']],\n      input: [['all','All (mean)'],['english','English'],['code','Code'],['math','Math'],['chinese','Chinese'],['json','JSON']],\n      component: [['KV','K + V'],['K','K only'],['V','V only']] };\n    const labels = { format: 'Format', model: 'Model', input: 'Input', component: 'Component' };\n    const controls = Object.keys(groups).map(key => ({ label: labels[key], opts: groups[key].map(([val, label]) => {\n      const on = sel[key] === val;\n      return { label, pressed: on ? 'true' : 'false', bg: on ? '#224b8d' : '#fafafa', color: on ? '#fff' : '#333',\n        border: on ? '#224b8d' : '#ddd', weight: on ? 600 : 400,\n        pick: () => this.setState(s => ({ sel: { ...s.sel, [key]: val } })) };\n    }) }));\n    const CTX = [512, 1024, 2048, 4096, 8192];\n    const ctxCols = ['512', '1K', '2K', '4K', '8K'];\n    const NAMES = { 'raw_zstd-1':'Zstd-1','raw_zstd-9':'Zstd-9','raw_zstd-19':'Zstd-19','raw_lz4':'LZ4','raw_snappy':'Snappy','raw_lzma':'LZMA','raw_brotli':'Brotli','raw_gzip':'Gzip','transpose+zstd-1':'Transpose + Zstd-1','bytesplit+zstd-1':'ByteSplit + Zstd-1','pipeline_zstd-1':'KVPress-Zstd-1','pipeline_zstd-9':'KVPress-Zstd-9','pipeline_zstd-19':'KVPress-Zstd-19','pipeline_lz4':'KVPress-LZ4','pipeline_lzma':'KVPress-LZMA' };\n    const base = { controls, ctxCols, rowsLabel: showAll ? 'Show top 8' : 'Show all 15 →',\n      toggleRows: () => this.setState(s => ({ showAll: !s.showAll })), matrix: [], tip: null, hasTip: false,\n      explorerCaption: mx ? '' : 'Loading benchmark matrix…' };\n    if (!mx) return base;\n    const inputs = sel.input === 'all' ? ['english','code','math','chinese','json'] : [sel.input];\n    const get = (ctx, mi, comp = sel.component) => {\n      const vals = inputs.map(inp => mx.data[`${sel.model}_${ctx}_${inp}`]?.[sel.format]?.[comp]?.[mi]).filter(v => v != null);\n      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;\n    };\n    let rows = mx.methods.map((m, mi) => ({ m, vals: CTX.map(c => get(c, mi)) }));\n    rows.sort((a, b) => (b.vals[4] ?? 0) - (a.vals[4] ?? 0));\n    const all = rows.flatMap(r => r.vals).filter(v => v != null);\n    const lo = Math.min(...all), hi = Math.max(...all);\n    const colBest = CTX.map((_, ci) => Math.max(...rows.map(r => r.vals[ci] ?? 0)));\n    const visible = showAll ? rows : rows.slice(0, 8);\n    const hv = this.state.hover;\n    const fmt4 = v => v == null ? '—' : v.toFixed(4) + '×';\n    const showTip = (e, r, ci) => {\n      const mi = mx.methods.indexOf(r.m), ctx = CTX[ci];\n      const col = rows.map(x => x.vals[ci] ?? -1).sort((a, b) => b - a);\n      this.setState({ hover: { x: e.clientX, y: e.clientY, name: NAMES[r.m] || r.m,\n        sub: `${F.find(f => f[0] === sel.format)[1]} · context ${ctx.toLocaleString()} · ${sel.input === 'all' ? 'all inputs' : sel.input}`,\n        kv: fmt4(get(ctx, mi, 'KV')), k: fmt4(get(ctx, mi, 'K')), v: fmt4(get(ctx, mi, 'V')),\n        rank: `Rank #${col.indexOf(r.vals[ci] ?? -1) + 1} of ${rows.length} at this context`,\n        color: r.m.startsWith('pipeline_') ? '#8b2c2c' : r.m.includes('+') ? '#5a6fa8' : '#494e52' } });\n    };\n    const tip = hv ? { ...hv, left: Math.min(hv.x + 16, (window.innerWidth || 1200) - 250) + 'px', top: Math.max(12, hv.y - 40) + 'px' } : null;\n    const matrix = visible.map((r, ri) => {\n      const g = r.m.startsWith('pipeline_') ? '#8b2c2c' : r.m.includes('+') ? '#5a6fa8' : '#bdc1c4';\n      return { name: NAMES[r.m] || r.m, dot: g, rank: '#' + (ri + 1), weight: ri === 0 ? 700 : 400,\n        cells: r.vals.map((v, ci) => {\n          if (v == null) return { v: '—', bg: '#fafafa', fg: '#bdc1c4', weight: 400 };\n          const t = hi > lo ? (v - lo) / (hi - lo) : 0.5;\n          const top = t > 0.9;\n          const pctMix = top ? 85 : Math.round(5 + t * 55);\n          return { v: v.toFixed(2) + '×', bg: `color-mix(in srgb, #224b8d ${pctMix}%, #fff)`,\n            fg: top ? '#fff' : '#1a1a1a', weight: v === colBest[ci] ? 700 : 400,\n            enter: e => showTip(e, r, ci), move: e => showTip(e, r, ci),\n            leave: () => this.setState({ hover: null }),\n            outline: hv && hv.name === (NAMES[r.m] || r.m) && hv.ci === ci ? '2px solid #1a1a1a' : 'none' };\n        }) };\n    });\n    const fl = F.find(f => f[0] === sel.format)[1];\n    return { ...base, matrix, tip, hasTip: !!tip,\n      explorerCaption: `${fl} · ${sel.model} · ${sel.input === 'all' ? 'mean of five input types' : sel.input} · ${sel.component === 'KV' ? 'K + V' : sel.component}. Sorted by 8K ratio; bold marks the best method per context. Shading spans ${lo.toFixed(2)}× – ${hi.toFixed(2)}× for this slice.` };\n  }\n  renderVals() {\n    const p = this.props;\n    const expanded = p.faqExpanded ?? false;\n    const logScale = (p.ttftScale ?? 'linear') === 'log';\n    const max = 1.6, pct = v => (v / max * 100).toFixed(1) + '%';\n    const methods = [\n      ['fpzip', 0.56], ['zfp reversible', 1.02], ['Raw Zstd-1', 1.29],\n      ['XOR prev. token + Zstd-1', 1.46], ['ByteSplit + Zstd-1', 1.48], ['Best structure-aware', 1.52, true]\n    ].map(([name, v, best]) => ({ name, v: v.toFixed(2) + '×', w: pct(v),\n      color: best ? '#224b8d' : name === 'ByteSplit + Zstd-1' ? '#5a6fa8' : '#bdc1c4',\n      text: best ? '#224b8d' : '#1a1a1a' }));\n    const ctxBars = [['Qwen2.5 · 512', 1.56], ['Qwen2.5 · 8K', 1.86], ['Qwen3 · 512', 1.52], ['Qwen3 · 8K', 1.78]]\n      .map(([name, v], i) => ({ name, v: v.toFixed(2) + '×', w: (v / 2 * 100) + '%', color: i % 2 ? '#224b8d' : '#bdc1c4' }));\n    const vio = 'rgba(0,0,0,0)';\n    const reps = [\n      ['BF16', '1.71×', 'Representation-lossless', 'Primary result', true],\n      ['FP32', '3.43×', 'Representation-lossless', '4-byte denominator; not directly comparable', true],\n      ['FP16', '1.75×', 'Transformed payload', 'Conversion precedes codec'],\n      ['FP8 E4M3 / E5M2', '1.56× / 1.95×', 'Transformed payload', 'Different bit layouts expose different structure'],\n      ['INT8 / INT4 / INT2', '1.27× / 1.92× / 5.00×', 'Transformed payload', 'Quantization and metadata are separate system choices'],\n    ].map(([name, ratio, scope, note, ok], i) => ({ name, ratio, scope, note,\n      bg: i === 0 ? '#fafbff' : vio, chipBg: ok ? '#eef2ff' : '#fef3c7', chipText: ok ? '#4a5fd1' : '#92400e' }));\n    const raw = [\n      ['8K', 0.21, 0.21, 0.15, '6.3 ms', '6.2 ms'], ['32K', 0.91, 0.91, 0.19, '13.8 ms', '12.0 ms'],\n      ['64K', 1.9, 1.9, 0.24, '23.5 ms', '18.9 ms'], ['128K', 5.0, 6.0, 0.29, '43.8 ms', '34.5 ms'],\n      ['192K', 8.6, 10.9, 0.36, '63.9 ms', '49.4 ms'], ['256K', 11, 15, 0.44, '83.9 ms', '64.4 ms'],\n    ];\n    const fmt = v => (v >= 1 ? +v.toFixed(1) : v) + '';\n    const sc = logScale\n      ? v => Math.max(0, (Math.log10(v) + 1) / (Math.log10(15) + 1))\n      : v => v / 15;\n    const avail = 82;\n    const ttft = raw.map(([p, lo, hi, res, rw, ans]) => ({\n      p, raw: rw, ans,\n      rec: lo === hi ? fmt(lo) + ' s' : fmt(lo) + '\\u2013' + fmt(hi) + ' s',\n      res: res + ' s',\n      recW: (sc(hi) * avail).toFixed(2) + '%',\n      recLoPct: (sc(lo) / sc(hi) * 100).toFixed(1) + '%',\n      resW: (sc(res) * avail).toFixed(2) + '%',\n    }));\n    const faqData = [\n      ['What does lossless mean here?', 'After encoding, decompression must reconstruct the selected payload bytes exactly. BF16 and FP32 preserve their selected representation. FP16, FP8, and INT results include a prior conversion and are only lossless over that transformed payload.'],\n      ['What is the coding unit?', 'The source benchmark processes per-layer K and V payloads and aggregates them into the model / context / input points exposed here. Per-layer rows are not retained in this page dataset.'],\n      ['Why byte split?', 'It separates the two byte positions of multi-byte values so a generic codec sees more homogeneous streams. In BF16, ByteSplit + Zstd has a 1.51× median ratio versus 1.29× for raw Zstd-1.'],\n      ['Why channel-first layout?', 'It places values from the same feature channel closer together before coding, exposing regularity that row-major token layout can hide.'],\n      ['Why not just LZ / zstd / gzip?', 'They are all included as raw baselines. On real-text BF16 KV, raw Zstd-1 reaches 1.29×; exposing layout and byte structure first raises the median best result to 1.52×. In the repeated-input matrix the same step goes from 1.42× to 1.71×.'],\n      ['What metadata is required?', 'Tensor framing is outside the reported payload ratio. Quantized INT representations also require scale and packing metadata; those bytes are not included in this page dataset.'],\n      ['Does it support random access?', 'Not evaluated in this benchmark. The page does not measure block size, partial decode, or token-level access.'],\n      ['Does the decoder become the bottleneck?', 'Zstd-only decompression reached 15.2 GB/s at 16 threads. Full reconstruction reached about 4 GB/s in Python; a faster C path was estimated but not measured.'],\n      ['CPU, GPU, or overlap with copies?', 'The host pipeline plateaued near 1 GB/s because preprocessing and Python-to-CPU transfer dominated. GPU preprocessing was 1.73× faster than CPU. Copy/codec overlap was not evaluated.'],\n      ['Did compression make KV reads faster?', 'No meaningful change. The compressed path measured 0.95–1.01× the uncompressed baseline latency — roughly 5% faster to 1% slower. The earlier 71 ms → 50 ms estimate was theoretical; the real KV cache test superseded it.'],\n      ['Compression vs quantization?', 'Quantization changes the representation and may change model outputs. The codec stage reconstructs the chosen payload exactly. They answer different correctness questions.'],\n      ['Why not layer-adaptive coding?', 'The hypothesis is plausible, but this page has no per-layer result rows. Layer dependence is therefore not claimed from this dataset.'],\n      ['What else is not measured?', 'Production memory savings, concurrency gain, end-to-end serving throughput, and copy/codec overlap.'],\n    ];\n    const isOpen = i => this.state.open[i] ?? expanded;\n    const faqs = faqData.map(([q, a], i) => ({ q, a, open: isOpen(i), icon: isOpen(i) ? '−' : '+',\n      toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !isOpen(i) } })) }));\n    const allOpen = faqs.every(f => f.open);\n    return {\n      ...this.explorerVals(),\n      navLinks: [\n        { label: 'Core finding', href: '#finding' }, { label: 'Systems', href: '#systems' },\n        { label: 'Serving', href: '#serving' }, { label: 'Boundaries', href: '#boundaries' },\n      ],\n      methods, baseline: pct(1), ctxBars, reps, ttft, faqs,\n      ttftCaption: (logScale ? 'Log scale. ' : 'Linear scale. ') + 'Light gray extension shows the recompute range across 6 prompts per length.',\n      toggleLabel: allOpen ? 'Collapse all' : 'Expand all',\n      toggleAll: () => { const o = {}; faqData.forEach((_, i) => o[i] = !allOpen); this.setState({ open: o }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
