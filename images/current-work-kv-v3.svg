<text class="part" x="150" y="331" text-anchor="middle" fill="#0F7C8A">attention KV</text>

<!-- restored: the same two parts, each checked -->
<rect x="628" y="232" width="204" height="52" rx="14" fill="#0F7C8A"/>
<path class="line" style="stroke:#FFFFFF;stroke-width:4" d="M717 258l9 10 17-20"/>
<rect x="629.5" y="295.5" width="201" height="55" rx="14" fill="#DDF1F2" stroke="#0F7C8A" stroke-width="3"/>
<path class="line" style="stroke-width:4" d="M717 323l9 10 17-20"/>

<!-- hero -->
<text class="num" x="440" y="326" text-anchor="middle" font-size="110" fill="#0F7C8A">48/48</text>
<text class="lab" x="440" y="382" text-anchor="middle">restores byte-identical</text>
<text class="mut" x="440" y="414" text-anchor="middle">3 trials × 8 H800 GPUs × 2 parts</text>

<!-- round trip through the bounded store -->
<path class="line" d="M150 364V456Q150 478 172 478H258M246 466l13 12-13 12"/>
