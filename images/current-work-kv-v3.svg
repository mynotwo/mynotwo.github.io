<rect x="270" y="438" width="340" height="80" rx="16" fill="#F3F6FA" stroke="#DCE3EA" stroke-width="2.5"/>
<rect x="318" y="457" width="44" height="16" rx="6" fill="#0F7C8A"/>
<rect x="319.25" y="480.25" width="41.5" height="20.5" rx="6" fill="#DDF1F2" stroke="#0F7C8A" stroke-width="2.5"/>
<text class="lab" x="380" y="473">bounded store</text>
<text class="mut" x="380" y="502">1 GiB per GPU</text>

