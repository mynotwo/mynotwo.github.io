<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
<title id="t">Offload the cache. Get every byte back.</title>
<desc id="d">A hybrid model's reusable prefix has two parts, recurrent state and attention KV. Both leave the GPU for a bounded store capped at 1 GiB per GPU and come back: in three trials on eight H800 GPUs, all 48 restored record parts (3 trials × 8 GPUs × 2 parts) read back byte-identical. Evidence boundary: three bounded trials on one private development checkpoint; one of the three still failed the model-output check, so whole-model output equivalence is unresolved, and the upstream pull request is an unmerged draft.</desc>
<metadata id="research-source">https://github.com/mynotwo/aibrix-hybrid-kvcache/issues/1#issuecomment-6300253903</metadata>
<style>
.f{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.kicker{font-size:22px;font-weight:700;letter-spacing:.14em;fill:#0F7C8A}
.h{font-size:46px;font-weight:800;fill:#16212E;letter-spacing:-.01em}
.lab{font-size:26px;font-weight:600;fill:#3A4A5E}
.mut{font-size:22px;font-weight:500;fill:#6B7A8C}
.note{font-size:20px;font-weight:500;fill:#6B7A8C}
.num{font-weight:800;letter-spacing:-.02em}
.part{font-size:22px;font-weight:600}
.line{fill:none;stroke:#0F7C8A;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="880" height="600" rx="28" fill="#FFFFFF"/>
