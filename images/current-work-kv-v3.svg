<!-- on the GPU: the two parts of a reusable prefix -->
<rect x="48" y="232" width="204" height="52" rx="14" fill="#0F7C8A"/>
<text class="part" x="150" y="266" text-anchor="middle" fill="#FFFFFF">recurrent state</text>
