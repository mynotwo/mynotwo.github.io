<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc"><title id="title">Resource measures and code attribution</title><desc id="desc">Technical schematic based on the Omni Profiler article: CPU time, GPU kernel duration and live memory carry distinct weights and code attribution. Live memory depends on allocation and release lifetimes. No sample counts, measured profile widths, overhead or performance values are represented.</desc><metadata id="research-source">https://github.com/mynotwo/mynotwo.github.io/blob/18562fc/_posts/2026-10-23-omni-profiler.md</metadata><rect width="440" height="300" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="30" font-size="22" fill="#263644" font-weight="600" text-anchor="start">Resource attribution</text><text x="20" y="55" font-size="16" fill="#60717d" font-weight="400" text-anchor="start">Separate measurements; inspect responsible code</text><text x="20" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="start">Measure</text><text x="204" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="start">Weight</text><text x="295" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="start">Attribution</text><path d="M20 107H420" stroke="#263644" stroke-width="1"/><text x="20" y="144" font-size="19" fill="#263644" font-weight="400" text-anchor="start">CPU time</text><text x="204" y="144" font-size="18" fill="#167d8d" font-weight="400" text-anchor="start">time</text><text x="295" y="144" font-size="18" fill="#263644" font-weight="400" text-anchor="start">Call stack</text><path d="M20 159H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="188" font-size="19" fill="#263644" font-weight="400" text-anchor="start">GPU duration</text><text x="204" y="188" font-size="18" fill="#167d8d" font-weight="400" text-anchor="start">time</text><text x="295" y="188" font-size="18" fill="#263644" font-weight="400" text-anchor="start">Launch site</text><path d="M20 203H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="232" font-size="19" fill="#263644" font-weight="400" text-anchor="start">Live memory</text><text x="204" y="232" font-size="18" fill="#167d8d" font-weight="400" text-anchor="start">bytes</text><text x="295" y="232" font-size="18" fill="#263644" font-weight="400" text-anchor="start">Alloc / free</text><path d="M20 247H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="275" font-size="17" fill="#167d8d" font-weight="400" text-anchor="start">Memory traffic ≠ live allocated bytes</text><text x="20" y="295" font-size="15" fill="#60717d" font-weight="400" text-anchor="start">Attribution model · schematic, no measured values</text></g></svg>