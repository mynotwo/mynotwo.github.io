<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc"><title id="title">An observed process-order contradiction</title><desc id="desc">Simplified reconstruction of the case disclosed in the agent execution article: the answer claimed web before file, but the trace contained four file calls before any web call. The result was correct. Column positions encode tool-call order, not time or duration. This is one observed case, not a population-level failure rate.</desc><metadata id="research-source">https://github.com/mynotwo/mynotwo.github.io/blob/18562fc/_posts/2026-10-23-agent-execution-evidence.md</metadata><rect width="440" height="300" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="30" font-size="21" fill="#263644" font-weight="600" text-anchor="start">Process claim vs. execution evidence</text><text x="20" y="65" font-size="16" fill="#60717d" font-weight="400" text-anchor="start">Claim</text><text x="90" y="65" font-size="20" fill="#263644" font-weight="400" text-anchor="start">Web checked before file</text><path d="M20 84H420" stroke="#263644" stroke-width="1"/><text x="20" y="115" font-size="18" fill="#60717d" font-weight="400" text-anchor="start">Observed tool-call order</text><text x="56" y="145" font-size="16" fill="#60717d" font-weight="400" text-anchor="middle">1</text><rect x="20" y="157" width="72" height="44" fill="#e9f3f4" stroke="none" stroke-width="1"/><text x="56" y="185" font-size="20" fill="#167d8d" font-weight="600" text-anchor="middle">File</text><text x="136" y="145" font-size="16" fill="#60717d" font-weight="400" text-anchor="middle">2</text><rect x="100" y="157" width="72" height="44" fill="#e9f3f4" stroke="none" stroke-width="1"/><text x="136" y="185" font-size="20" fill="#167d8d" font-weight="600" text-anchor="middle">File</text><text x="216" y="145" font-size="16" fill="#60717d" font-weight="400" text-anchor="middle">3</text><rect x="180" y="157" width="72" height="44" fill="#e9f3f4" stroke="none" stroke-width="1"/><text x="216" y="185" font-size="20" fill="#167d8d" font-weight="600" text-anchor="middle">File</text><text x="296" y="145" font-size="16" fill="#60717d" font-weight="400" text-anchor="middle">4</text><rect x="260" y="157" width="72" height="44" fill="#e9f3f4" stroke="none" stroke-width="1"/><text x="296" y="185" font-size="20" fill="#167d8d" font-weight="600" text-anchor="middle">File</text><text x="376" y="145" font-size="16" fill="#60717d" font-weight="400" text-anchor="middle">5</text><rect x="340" y="157" width="72" height="44" fill="#f5eadd" stroke="none" stroke-width="1"/><text x="376" y="185" font-size="20" fill="#b97132" font-weight="600" text-anchor="middle">Web</text><text x="20" y="231" font-size="17" fill="#263644" font-weight="400" text-anchor="start">Four file calls precede the first web call.</text><path d="M20 248H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="274" font-size="18" fill="#167d8d" font-weight="400" text-anchor="start">Result: correct</text><text x="420" y="274" font-size="17" fill="#b97132" font-weight="400" text-anchor="end">Order claim: contradicted</text><text x="20" y="295" font-size="15" fill="#60717d" font-weight="400" text-anchor="start">One observed case · ordinal positions, not timing</text></g></svg>