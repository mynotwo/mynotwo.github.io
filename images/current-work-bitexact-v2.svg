<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc"><title id="title">Historical logits and token identity against H800</title><desc id="desc">Selected historical main-run results from the project README, before current arithmetic guards: H100, x86 CPU and Apple M4 Pro report zero full-logits-row hash differences and zero sampled-token differences over 3,696 generated positions, against H800. This is not a new measurement or universal device certification.</desc><metadata id="research-source">https://github.com/mynotwo/bitexact-llm/blob/a827ed6900188647c77e2d3cfcd07975d6cf945a/README.md#bit-identity</metadata><rect width="440" height="300" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="30" font-size="22" fill="#263644" font-weight="600" text-anchor="start">Reported cross-device identity</text><text x="20" y="55" font-size="16" fill="#60717d" font-weight="400" text-anchor="start">Llama-3.2-1B · exact mode · 3,696 positions</text><text x="20" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="start">Device</text><text x="280" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="middle">Logits ≠</text><text x="379" y="94" font-size="17" fill="#60717d" font-weight="400" text-anchor="middle">Tokens ≠</text><path d="M20 106H420" stroke="#263644" stroke-width="1"/><text x="20" y="140" font-size="20" fill="#263644" font-weight="400" text-anchor="start">H100</text><text x="280" y="140" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><text x="379" y="140" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><path d="M20 155H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="183" font-size="20" fill="#263644" font-weight="400" text-anchor="start">x86 CPU</text><text x="280" y="183" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><text x="379" y="183" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><path d="M20 198H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="226" font-size="20" fill="#263644" font-weight="400" text-anchor="start">Apple M4 Pro</text><text x="280" y="226" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><text x="379" y="226" font-size="23" fill="#167d8d" font-weight="600" text-anchor="middle">0</text><path d="M20 241H420" stroke="#dce3e7" stroke-width="1"/><text x="20" y="273" font-size="15" fill="#60717d" font-weight="400" text-anchor="start">Reference: H800 · full-row logits SHA-256</text><text x="20" y="294" font-size="15" fill="#60717d" font-weight="400" text-anchor="start">Historical runs, before current arithmetic guards</text></g></svg>