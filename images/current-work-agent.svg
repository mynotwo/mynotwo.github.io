<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Check the claim against the trace</title><desc id="desc">An illustrative rendering of a process-order mismatch: the answer claims web before file, but the observed trace has file before web.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75869b"/></marker></defs>
<rect width="440" height="300" rx="12" fill="#f6f8fb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="35" font-size="18" fill="#263b53" text-anchor="start" font-weight="700">THE ANSWER IS NOT THE TRACE</text><text x="24" y="74" font-size="15" fill="#63758b" text-anchor="start" font-weight="500">CLAIM</text><rect x="24" y="87" width="392" height="46" rx="9" fill="#e9eff8" stroke="#c8d5e5"/><text x="220.0" y="117.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">Web first → then file</text><text x="24" y="167" font-size="15" fill="#63758b" text-anchor="start" font-weight="500">OBSERVED EXECUTION</text><rect x="24" y="180" width="392" height="46" rx="9" fill="#f9e9d9" stroke="#e9c7a4"/><text x="220.0" y="210.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">File calls → then web</text><text x="220" y="270" font-size="18" fill="#263b53" text-anchor="middle" font-weight="600">Correct result ≠ accurate process claim</text></g></svg>