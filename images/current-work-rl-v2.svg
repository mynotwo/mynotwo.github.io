 <title id="rl-title">Best reported terminal accuracy at three selected OLMo-2-7B checkpoints</title><desc id="rl-desc">GSM results from the published checkpoint summary: GT reward, four seeds, maxima 2, 90.5 and 100 percent; random reward, eight seeds, maxima 2, 13 and 77.5 percent. Selected checkpoints P1 34B, P1 3896B and P2 plus 5B. Maxima are not means; seed counts differ. Bars start at zero.</desc><metadata id="research-source">https://arxiv.org/html/2610.01066v1</metadata><metadata>
