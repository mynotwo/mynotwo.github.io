<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
<title id="t">Four chips, one answer, bit for bit</title>
<desc id="d">Four processors (H800 GPU, H100 GPU, x86 Xeon CPU, Apple M4 Pro CPU) each carry the same bit pattern and feed one result: 0 differing logits rows or sampled tokens against the H800 reference in 3,696 generated positions of 16 samples. The bit patterns are symbolic, not recorded hashes. Evidence boundary: integer-arithmetic Llama-3.2-1B engine in exact mode, historical runs recorded at revision a030ba7, before the current arithmetic guards; not a certification of other devices or of the current source.</desc>
<metadata id="research-source">https://github.com/mynotwo/bitexact-llm/blob/a030ba7421aa61b6469a79efe85a61002512c476/README.md#verified-results-exact-mode</metadata>
