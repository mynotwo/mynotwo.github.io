<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
<title id="title">Store state. Restore the same bytes.</title><desc id="desc">State and attention spans are encoded into records, stored, and validated on restore. This illustrates the byte path, not whole-model equivalence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75869b"/></marker></defs>
<rect width="440" height="300" rx="12" fill="#f6f8fb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="35" font-size="18" fill="#263b53" text-anchor="start" font-weight="700">STATE → STORAGE → RESTORE</text><rect x="24" y="70" width="116" height="54" rx="9" fill="#e9eff8" stroke="#c8d5e5"/><text x="82.0" y="104.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">State + KV</text><path d="M144 97H167" fill="none" stroke="#75869b" stroke-width="2" marker-end="url(#arrow)"/><rect x="174" y="70" width="112" height="54" rx="9" fill="#e9eff8" stroke="#c8d5e5"/><text x="230.0" y="104.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">Encode</text><path d="M290 97H313" fill="none" stroke="#75869b" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="70" width="96" height="54" rx="9" fill="#e9eff8" stroke="#c8d5e5"/><text x="368.0" y="104.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">Store</text><path d="M368 128V168H222V185" fill="none" stroke="#75869b" stroke-width="2" marker-end="url(#arrow)"/><rect x="97" y="190" width="246" height="50" rx="9" fill="#e4f1ee" stroke="#b1d4ca"/><text x="220.0" y="222.0" font-size="20" fill="#263b53" text-anchor="middle" font-weight="500">Decode + byte check</text><text x="220" y="275" font-size="18" fill="#263b53" text-anchor="middle" font-weight="500">Bounded storage · reader leases</text></g></svg>